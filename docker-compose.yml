# Runs the API in a container (H2 in memory). Copy .env.example to .env and set your own credentials first.
services:
  api:
    build: .
    image: invex/employees-api:1.0.0
    container_name: employees-api
    environment:
      API_USERNAME: ${API_USERNAME:?set API_USERNAME in .env}
      API_PASSWORD: ${API_PASSWORD:?set API_PASSWORD in .env}
    ports:
      - "8080:8080"
    restart: unless-stopped
